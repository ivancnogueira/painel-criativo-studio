<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sua Licença · CriativoOS</title>
    <link rel="icon" type="image/svg+xml" href="/symbol-oo-volt.svg" />
    <style>
      :root {
        --bg: #0b0c0f;
        --card: #141720;
        --card-2: #1b1f2b;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f4f5f7;
        --muted: #9ca3af;
        --accent: #b9fc01;
        --accent-ink: #0d0d0d;
        --ok: #31cf76;
        --danger: #ff5a65;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        min-height: 100dvh;
        background:
          radial-gradient(circle at 15% 15%, rgba(185, 252, 1, 0.08), transparent 36%),
          radial-gradient(circle at 85% 85%, rgba(56, 189, 248, 0.08), transparent 40%),
          var(--bg);
        color: var(--text);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        line-height: 1.5;
      }
      .shell {
        width: 100%;
        max-width: 640px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.65);
      }
      .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
      .brand img { height: 24px; }
      .pill {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
        background: rgba(49, 207, 118, 0.14); color: var(--ok);
      }
      .pill.revoked { background: rgba(255, 90, 101, 0.14); color: var(--danger); }
      h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.02em; }
      p.sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
      .key-box {
        background: var(--card-2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 20px;
      }
      .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
      .email-val { font-weight: 600; font-size: 15px; margin-bottom: 14px; word-break: break-word; }
      .key-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .key-code {
        flex: 1;
        min-width: 220px;
        font-family: "JetBrains Mono", Consolas, monospace;
        font-size: 17px;
        font-weight: 700;
        color: var(--accent);
        background: #0d1016;
        border: 1px dashed rgba(185, 252, 1, 0.5);
        border-radius: 10px;
        padding: 11px 14px;
        letter-spacing: 0.8px;
        word-break: break-all;
      }
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 11px 16px;
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 700;
        cursor: pointer;
        background: var(--accent);
        color: var(--accent-ink);
        transition: transform 0.14s ease, opacity 0.14s ease;
      }
      .btn:active { transform: scale(0.97); }
      .meta-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 14px;
        font-size: 12.5px;
      }
      .meta-item { background: rgba(255, 255, 255, 0.03); border-radius: 10px; padding: 10px; }
      .meta-item strong { display: block; margin-top: 2px; font-size: 13.5px; }
      .dl-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 12px 0 20px; }
      .dl-card {
        display: flex; flex-direction: column; gap: 4px;
        text-decoration: none; color: var(--text);
        background: var(--card-2); border: 1px solid var(--border);
        border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 600;
        transition: border-color 0.15s ease;
      }
      .dl-card:hover { border-color: var(--accent); }
      .dl-card span { font-size: 11.5px; color: var(--muted); font-weight: 400; }
      ol.steps { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; }
      ol.steps li { margin-bottom: 6px; }
      ol.steps strong { color: var(--text); }
      .error-box { text-align: center; padding: 24px 8px; color: var(--muted); }
      @media (max-width: 600px) {
        .meta-grid, .dl-grid { grid-template-columns: 1fr; }
        .shell { padding: 20px; }
      }
    </style>
  </head>
  <body>
    <main class="shell" id="delivery-root">
      <div class="error-box">Carregando dados da sua licença...</div>
    </main>
    <script>
      (async function () {
        var root = document.getElementById("delivery-root");
        var parts = window.location.pathname.split("/").filter(Boolean);
        var token = parts[parts.length - 1] || "";
        function esc(s) {
          return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
        try {
          var res = await fetch("/api/delivery/" + encodeURIComponent(token));
          if (!res.ok) throw new Error("not_found");
          var data = await res.json();
          var d = data.delivery;
          var active = d.status === "active";
          var servers = d.max_servers < 0 ? "Ilimitados" : d.max_servers + " servidores";
          var upgrades = Array.isArray(d.upgrades) && d.upgrades.length ? d.upgrades.join(", ").toUpperCase() : "Nenhum";
          root.innerHTML =
            '<div class="brand">' +
              '<img src="/logo-criativoos-dark.svg" alt="CriativoOS" />' +
              '<span class="pill ' + (active ? "" : "revoked") + '">' + (active ? "Licença Ativa" : esc(d.status)) + "</span>" +
            "</div>" +
            "<h1>Central de Entrega da Licença</h1>" +
            '<p class="sub">Olá' + (d.customer_name ? ", " + esc(d.customer_name.split(/\s+/)[0]) : "") + "! Seus dados de ativação e instaladores oficiais estão abaixo.</p>" +
            '<div class="key-box">' +
              '<div class="label">E-mail de ativação</div>' +
              '<div class="email-val">' + esc(d.customer_email) + "</div>" +
              '<div class="label">Chave de licença</div>' +
              '<div class="key-row">' +
                '<div class="key-code" id="key-text">' + esc(d.license_key) + "</div>" +
                '<button type="button" class="btn" id="btn-copy-key">Copiar Chave</button>' +
              "</div>" +
              '<div class="meta-grid">' +
                '<div class="meta-item"><span class="label">Plano</span><strong>' + esc(d.plan_name) + "</strong></div>" +
                '<div class="meta-item"><span class="label">Computadores</span><strong>' + esc(d.active_machines + " / " + d.max_machines) + "</strong></div>" +
                '<div class="meta-item"><span class="label">Servidores · Upgrades</span><strong>' + esc(servers + " · " + upgrades) + "</strong></div>" +
              "</div>" +
            "</div>" +
            "<strong>1. Baixe o aplicativo oficial</strong>" +
            '<div class="dl-grid">' +
              '<a class="dl-card" href="' + esc(d.download_links.windows) + '" target="_blank" rel="noopener">Windows<span>Instalador (.exe)</span></a>' +
              '<a class="dl-card" href="' + esc(d.download_links.macos) + '" target="_blank" rel="noopener">macOS<span>Apple Silicon / Intel (.dmg)</span></a>' +
              '<a class="dl-card" href="' + esc(d.download_links.linux) + '" target="_blank" rel="noopener">Linux<span>AppImage (.AppImage)</span></a>' +
            "</div>" +
            "<strong>2. Ative em 30 segundos</strong>" +
            '<ol class="steps">' +
              "<li>Instale e abra o <strong>CriativoOS</strong> no seu computador.</li>" +
              "<li>Informe o e-mail <strong>" + esc(d.customer_email) + "</strong> e cole a chave acima.</li>" +
              "<li>Clique em <strong>Ativar licença agora</strong>.</li>" +
            "</ol>";
          var btn = document.getElementById("btn-copy-key");
          if (btn) {
            btn.addEventListener("click", function () {
              navigator.clipboard.writeText(d.license_key).then(function () {
                btn.textContent = "Copiado ✓";
                setTimeout(function () { btn.textContent = "Copiar Chave"; }, 2000);
              });
            });
          }
        } catch (err) {
          root.innerHTML = '<div class="error-box"><h2>Link de entrega não encontrado</h2><p>Verifique se a URL está correta ou solicite o reenvio ao suporte.</p></div>';
        }
      })();
    </script>
  </body>
</html>
